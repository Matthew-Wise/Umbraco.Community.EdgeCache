name: Release CloudFlare Provider

# Triggered by tags of the form: cloudflare-<UmbracoMajor>.<PackageMajor>.<Patches>
# e.g. cloudflare-17.0.0

on:
  push:
    tags:
      - 'cloudflare-[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        run: echo "VERSION=${GITHUB_REF_NAME#cloudflare-}" >> "$GITHUB_ENV"

      - name: Build & Pack
        run: dotnet pack src/Umbraco.Community.EdgeCache.CloudFlare/Umbraco.Community.EdgeCache.CloudFlare.csproj -c Release /p:Version=${{ env.VERSION }}

      - name: Push to NuGet
        run: dotnet nuget push "**/*.nupkg" -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
